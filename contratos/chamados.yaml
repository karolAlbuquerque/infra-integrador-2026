openapi: 3.1.0
info:
  title: Chamados e Relatórios — Grupo 3
  version: 0.1.0
  summary: Help desk com SLA e motor de relatórios da plataforma.
  description: |
    Endpoints do módulo `chamados`. Abertura e ciclo de vida de chamados técnicos (internos e de cliente),
    controle de SLA com pausa, interações, apontamentos de horas e os relatórios técnicos.
    Publicado antes da implementação, conforme §14.1 do Contrato de Integração.

    **Eventos (checklist, item 17):** nesta versão o módulo não publica eventos no RabbitMQ nem
    mensagens em `identity.entrada`. Quando passar a publicar, descreve antes em
    `contratos/chamados.asyncapi.yaml`.
  license:
    name: Uso acadêmico — Projeto Integrador 2026
    identifier: LicenseRef-Academico
servers:
  - url: http://localhost:8080
    description: Pelo gateway
  - url: http://chamados:8086
    description: Direto, entre serviços
tags:
  - name: chamados
    description: Abertura, consulta e edição de chamados
  - name: ciclo-de-vida
    description: Transições de estado do chamado
  - name: interacoes
    description: Notas internas e respostas ao solicitante
  - name: apontamentos
    description: Horas trabalhadas no chamado
  - name: cadastros
    description: Categorias, políticas de SLA e vínculo com contrato
  - name: integracao
    description: Endpoints consumidos por outros módulos
  - name: relatorios
    description: Relatórios técnicos
  - name: saude
    description: Estado do serviço

security:
  - bearerJwt: []

paths:
  /api/chamados/chamados:
    get:
      tags: [chamados]
      operationId: listarChamados
      summary: Listar chamados do tenant
      description: Exige `chamados.chamado.ver`.
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamanho'
        - name: status
          in: query
          description: Filtra por um ou mais status
          schema:
            type: array
            items:
              type: string
              enum: [novo, em_atendimento, aguardando_cliente, aguardando_fornecedor, escalado, resolvido, fechado, reaberto]
        - name: prioridade
          in: query
          description: Filtra por prioridade
          schema: { type: string, enum: [baixa, media, alta, critica] }
        - name: tipo
          in: query
          description: Filtra chamados internos ou de cliente
          schema: { type: string, enum: [interno, cliente] }
        - name: categoriaId
          in: query
          description: Filtra por categoria
          schema: { type: string, format: uuid }
        - name: tecnicoId
          in: query
          description: Filtra por técnico responsável
          schema: { type: string, format: uuid }
        - name: empresaId
          in: query
          description: Filtra por empresa do CRM
          schema: { type: string, format: uuid }
        - name: de
          in: query
          description: Data inicial de abertura
          schema: { type: string, format: date }
        - name: ate
          in: query
          description: Data final de abertura
          schema: { type: string, format: date }
        - name: vencendo
          in: query
          description: Apenas chamados em aberto cujo prazo de resolução vence nas próximas 24 horas
          schema: { type: boolean, default: false }
        - name: ordenar
          in: query
          description: Campo e direção
          schema:
            type: string
            enum: ['criadoEm,desc', 'criadoEm,asc', 'venceResolucaoEm,asc', 'prioridade,desc']
            default: 'criadoEm,desc'
      responses:
        '200':
          description: Página de chamados
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Pagina'
                          - properties:
                              itens:
                                type: array
                                items: { $ref: '#/components/schemas/ChamadoResumo' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    post:
      tags: [chamados]
      operationId: criarChamado
      summary: Abrir chamado
      description: |
        Exige `chamados.chamado.criar`. Os três prazos de SLA são calculados e congelados neste momento, a
        partir do prazo da prioridade do chamado na política vinculada ao contrato ou, na ausência dela, na
        política padrão. Editar a política depois não mexe neles.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovoChamado' }
      responses:
        '201':
          description: Chamado aberto
          headers:
            Location:
              description: Endereço do chamado criado
              schema: { type: string, example: /api/chamados/chamados/5c2d9e1a-0f3b-4b7e-9a6d-1e2f3a4b5c6d }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Chamado' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /api/chamados/chamados/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador do chamado
        schema: { type: string, format: uuid }
    get:
      tags: [chamados]
      operationId: verChamado
      summary: Ver um chamado
      description: Exige `chamados.chamado.ver`. Chamado de outro tenant responde 404.
      responses:
        '200':
          description: Chamado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Chamado' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    put:
      tags: [chamados]
      operationId: editarChamado
      summary: Editar campos do chamado
      description: |
        Exige `chamados.chamado.editar`. Não altera status nem técnico — o técnico muda só por `atribuir`,
        que deixa o registro no histórico de transições.

        **Mudar `prioridade` ou `contratoId` recalcula os prazos de SLA** com a política que vale para a
        nova combinação, contados desde `criadoEm` e descontadas as pausas. A regra de congelamento protege o
        chamado de mudanças na política, não de uma reclassificação do próprio chamado. Prazo já cumprido
        (primeira resposta dada, atendimento iniciado) não é recalculado.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AtualizarChamado' }
      responses:
        '200':
          description: Chamado atualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Chamado' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    delete:
      tags: [chamados]
      operationId: excluirChamado
      summary: Excluir chamado (soft delete)
      description: Exige `chamados.chamado.excluir`.
      responses:
        '200':
          description: Chamado excluído
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /api/chamados/chamados/{id}/atribuir:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador do chamado
        schema: { type: string, format: uuid }
    post:
      tags: [ciclo-de-vida]
      operationId: atribuirChamado
      summary: Designar ou trocar o técnico responsável
      description: |
        Exige `chamados.chamado.atribuir`.

        - De `novo`, `reaberto` ou `escalado`, leva a `em_atendimento` com o técnico informado. De
          `escalado` é assim que o chamado passa ao técnico do outro nível. A primeira atribuição marca
          `atendimentoIniciadoEm`.
        - De `em_atendimento`, `aguardando_cliente` ou `aguardando_fornecedor`, **reatribui**: troca o
          técnico e mantém o status. Numa espera, o relógio continua pausado.
        - De `resolvido` ou `fechado`, responde 409.

        Toda atribuição, inclusive a reatribuição, entra no histórico de transições.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AtribuirRequest' }
      responses:
        '200':
          description: Chamado atribuído
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Chamado' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/EstadoInvalido' }

  /api/chamados/chamados/{id}/aguardar-cliente:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador do chamado
        schema: { type: string, format: uuid }
    post:
      tags: [ciclo-de-vida]
      operationId: aguardarCliente
      summary: Marcar espera pelo solicitante
      description: |
        Exige `chamados.chamado.editar`. De `em_atendimento` ou `escalado`. **Pausa o relógio do SLA** — a
        espera não é responsabilidade da equipe.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MotivoRequest' }
      responses:
        '200':
          description: Chamado em espera
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Chamado' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/EstadoInvalido' }

  /api/chamados/chamados/{id}/aguardar-fornecedor:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador do chamado
        schema: { type: string, format: uuid }
    post:
      tags: [ciclo-de-vida]
      operationId: aguardarFornecedor
      summary: Marcar espera por terceiro
      description: |
        Exige `chamados.chamado.editar`. De `em_atendimento` ou `escalado` — o caso típico é o nível 2
        esperando o fabricante. **Pausa o relógio do SLA.**
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MotivoRequest' }
      responses:
        '200':
          description: Chamado em espera
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Chamado' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/EstadoInvalido' }

  /api/chamados/chamados/{id}/retomar:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador do chamado
        schema: { type: string, format: uuid }
    post:
      tags: [ciclo-de-vida]
      operationId: retomarChamado
      summary: Voltar de uma espera para atendimento
      description: |
        Exige `chamados.chamado.editar`. De `aguardando_cliente` ou `aguardando_fornecedor`, volta ao
        estado de antes da espera: `em_atendimento` ou `escalado`. Os prazos de SLA são empurrados pela
        duração da pausa.
      responses:
        '200':
          description: Chamado retomado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Chamado' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/EstadoInvalido' }

  /api/chamados/chamados/{id}/escalar:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador do chamado
        schema: { type: string, format: uuid }
    post:
      tags: [ciclo-de-vida]
      operationId: escalarChamado
      summary: Escalar para outro nível de atendimento
      description: |
        Exige `chamados.chamado.editar`. Só de `em_atendimento`: um chamado que nunca teve técnico não é
        escalado, é atribuído — se já se sabe que é caso de nível 2, atribui-se direto a um técnico dele.
        **Não pausa o relógio** — escalar passa o trabalho adiante, mas o compromisso continua sendo do
        time. O técnico continua o mesmo até a próxima atribuição.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EscalarRequest' }
      responses:
        '200':
          description: Chamado escalado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Chamado' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/EstadoInvalido' }

  /api/chamados/chamados/{id}/resolver:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador do chamado
        schema: { type: string, format: uuid }
    post:
      tags: [ciclo-de-vida]
      operationId: resolverChamado
      summary: Registrar a solução
      description: |
        Exige `chamados.chamado.editar`. De `em_atendimento` ou `escalado`. A solução é obrigatória — sem
        ela o chamado fecharia vazio. Marca `resolvidoEm` e para o relógio de resolução.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResolverRequest' }
      responses:
        '200':
          description: Chamado resolvido
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Chamado' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/EstadoInvalido' }

  /api/chamados/chamados/{id}/fechar:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador do chamado
        schema: { type: string, format: uuid }
    post:
      tags: [ciclo-de-vida]
      operationId: fecharChamado
      summary: Encerrar o chamado
      description: |
        Exige `chamados.chamado.fechar`, permissão separada de `editar` de propósito: quem resolve não
        valida o próprio trabalho. Só de `resolvido`.
      responses:
        '200':
          description: Chamado fechado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Chamado' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/EstadoInvalido' }

  /api/chamados/chamados/{id}/reabrir:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador do chamado
        schema: { type: string, format: uuid }
    post:
      tags: [ciclo-de-vida]
      operationId: reabrirChamado
      summary: Reabrir chamado resolvido ou fechado
      description: |
        Exige `chamados.chamado.criar`. De `resolvido` ou `fechado`, leva a `reaberto` e incrementa o
        contador de reaberturas. De `fechado` não se vai direto a `em_atendimento` — senão a contagem de
        reaberturas, que é indicador de qualidade, se perde.

        **O prazo de resolução continua, não recomeça.** O intervalo entre `resolvidoEm` e a reabertura
        conta como pausa, e o relógio retoma de onde parou. Se recomeçasse, reabrir viraria um jeito de
        zerar um SLA estourado. Os prazos de primeira resposta e de atendimento, já cumpridos, não voltam.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MotivoRequest' }
      responses:
        '200':
          description: Chamado reaberto
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Chamado' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '409': { $ref: '#/components/responses/EstadoInvalido' }

  /api/chamados/chamados/{id}/interacoes:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador do chamado
        schema: { type: string, format: uuid }
    get:
      tags: [interacoes]
      operationId: listarInteracoes
      summary: Listar interações do chamado
      description: |
        Exige `chamados.chamado.ver`, que hoje só a equipe tem — por isso a lista traz as interações
        `interna` e `publica`. `publica` marca o que pode ser mostrado ao solicitante quando houver uma
        superfície para ele (portal do cliente, §46, ainda sem dono).
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: Página de interações
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Pagina'
                          - properties:
                              itens:
                                type: array
                                items: { $ref: '#/components/schemas/Interacao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    post:
      tags: [interacoes]
      operationId: criarInteracao
      summary: Registrar nota interna ou resposta ao solicitante
      description: |
        Exige `chamados.chamado.editar`. A primeira interação `publica` de um técnico preenche
        `primeiraRespostaEm` do chamado. Nota interna não conta.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovaInteracao' }
      responses:
        '201':
          description: Interação registrada
          headers:
            Location:
              description: Endereço da interação criada
              schema: { type: string, example: /api/chamados/chamados/5c2d9e1a-0f3b-4b7e-9a6d-1e2f3a4b5c6d/interacoes/3f8e1c2b-9a7d-4e6f-8b5a-2c1d0e9f8a7b }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Interacao' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /api/chamados/chamados/{id}/interacoes/{interacaoId}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador do chamado
        schema: { type: string, format: uuid }
      - name: interacaoId
        in: path
        required: true
        description: Identificador da interação
        schema: { type: string, format: uuid }
    get:
      tags: [interacoes]
      operationId: verInteracao
      summary: Ver uma interação
      description: Exige `chamados.chamado.ver`. É o endereço devolvido no `Location` de `criarInteracao`.
      responses:
        '200':
          description: Interação
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Interacao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /api/chamados/chamados/{id}/apontamentos:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador do chamado
        schema: { type: string, format: uuid }
    get:
      tags: [apontamentos]
      operationId: listarApontamentos
      summary: Listar horas apontadas no chamado
      description: Exige `chamados.chamado.ver`.
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: Página de apontamentos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Pagina'
                          - properties:
                              itens:
                                type: array
                                items: { $ref: '#/components/schemas/Apontamento' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
