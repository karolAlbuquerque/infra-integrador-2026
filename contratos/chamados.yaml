openapi: 3.1.0
info:
  title: Chamados e Relatórios — Grupo 3
  version: 0.1.0
  summary: Help desk com SLA e motor de relatórios da plataforma.
  description: |
    Endpoints do módulo `chamados`. Abertura e ciclo de vida de chamados técnicos (internos e de cliente),
    controle de SLA com pausa, interações, apontamentos de horas e os relatórios técnicos.
    Publicado antes da implementação, conforme §14.1 do Contrato de Integração.
  license:
    name: Uso acadêmico — Projeto Integrador 2026
    identifier: LicenseRef-Academico
servers:
  - url: http://localhost:8080
    description: Pelo gateway
  - url: http://chamados:8086
    description: Direto, entre serviços
tags:
  - name: chamados
    description: Abertura, consulta e edição de chamados
  - name: ciclo-de-vida
    description: Transições de estado do chamado
  - name: interacoes
    description: Notas internas e respostas ao solicitante
  - name: apontamentos
    description: Horas trabalhadas no chamado
  - name: cadastros
    description: Categorias, políticas de SLA e vínculo com contrato
  - name: integracao
    description: Endpoints consumidos por outros módulos
  - name: relatorios
    description: Relatórios técnicos
  - name: saude
    description: Estado do serviço

security:
  - bearerJwt: []

paths:
  /api/chamados/chamados:
    get:
      tags: [chamados]
      operationId: listarChamados
      summary: Listar chamados do tenant
      description: Exige `chamados.chamado.ver`.
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamanho'
        - name: status
          in: query
          description: Filtra por um ou mais status
          schema:
            type: array
            items:
              type: string
              enum: [novo, em_atendimento, aguardando_cliente, aguardando_fornecedor, escalado, resolvido, fechado, reaberto]
        - name: prioridade
          in: query
          description: Filtra por prioridade
          schema: { type: string, enum: [baixa, media, alta, critica] }
        - name: tipo
          in: query
          description: Filtra chamados internos ou de cliente
          schema: { type: string, enum: [interno, cliente] }
        - name: categoriaId
          in: query
          description: Filtra por categoria
          schema: { type: string, format: uuid }
        - name: tecnicoId
          in: query
          description: Filtra por técnico responsável
          schema: { type: string, format: uuid }
        - name: empresaId
          in: query
          description: Filtra por empresa do CRM
          schema: { type: string, format: uuid }
        - name: de
          in: query
          description: Data inicial de abertura
          schema: { type: string, format: date }
        - name: ate
          in: query
          description: Data final de abertura
          schema: { type: string, format: date }
        - name: vencendo
          in: query
          description: Apenas chamados em aberto cujo prazo de resolução vence nas próximas 24 horas
          schema: { type: boolean, default: false }
        - name: ordenar
          in: query
          description: Campo e direção
          schema:
            type: string
            enum: ['criadoEm,desc', 'criadoEm,asc', 'venceResolucaoEm,asc', 'prioridade,desc']
            default: 'criadoEm,desc'
      responses:
        '200':
          description: Página de chamados
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Pagina'
                          - properties:
                              itens:
                                type: array
                                items: { $ref: '#/components/schemas/ChamadoResumo' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    post:
      tags: [chamados]
      operationId: criarChamado
      summary: Abrir chamado
      description: |
        Exige `chamados.chamado.criar`. O prazo de SLA é calculado e congelado neste momento, a partir da
        política vinculada ao contrato ou, na ausência dela, da política padrão.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovoChamado' }
      responses:
        '201':
          description: Chamado aberto
          headers:
            Location:
              description: Endereço do chamado criado
              schema: { type: string, example: /api/chamados/chamados/5c2d9e1a-0f3b-4b7e-9a6d-1e2f3a4b5c6d }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Chamado' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /api/chamados/chamados/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador do chamado
        schema: { type: string, format: uuid }
    get:
      tags: [chamados]
      operationId: verChamado
      summary: Ver um chamado
      description: Exige `chamados.chamado.ver`. Chamado de outro tenant responde 404.
      responses:
        '200':
          description: Chamado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Chamado' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    put:
      tags: [chamados]
      operationId: editarChamado
      summary: Editar campos do chamado
      description: Exige `chamados.chamado.editar`. Não altera status.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AtualizarChamado' }
      responses:
        '200':
          description: Chamado atualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/Chamado' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    delete:
      tags: [chamados]
      operationId: excluirChamado
      summary: Excluir chamado (soft delete)
      description: Exige `chamados.chamado.excluir`.
      responses:
        '200':
          description: Chamado excluído
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /api/chamados/health:
    get:
      tags: [saude]
      operationId: saude
      summary: Serviço de pé e conectado ao banco
      description: Não exige token. Usado pela casca para avisar que o módulo está indisponível.
      security: []
      responses:
        '200':
          description: Disponível
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
              example: { success: true, data: { status: UP }, message: null, errors: [] }
        '503':
          description: Banco indisponível
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Pagina:
      name: pagina
      in: query
      description: Página, começando em zero
      schema: { type: integer, minimum: 0, default: 0 }
    Tamanho:
      name: tamanho
      in: query
      description: Itens por página, no máximo 100
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    DadosInvalidos:
      description: Dado inválido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
          example:
            success: false
            data: null
            message: Não foi possível salvar o chamado.
            errors:
              - { campo: assunto, codigo: CAMPO_INVALIDO, detalhe: Informe o assunto. }
    NaoAutenticado:
      description: Sem token, token inválido ou expirado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    SemPermissao:
      description: Sem a permissão exigida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    NaoEncontrado:
      description: Não existe ou pertence a outro tenant
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    EstadoInvalido:
      description: A transição não é válida para o estado atual do chamado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
          example:
            success: false
            data: null
            message: Não é possível fechar um chamado que ainda não foi resolvido.
            errors:
              - { campo: status, codigo: TRANSICAO_INVALIDA, detalhe: 'De novo só se vai para em_atendimento ou escalado.' }

  schemas:
    Envelope:
      type: object
      required: [success, data, message, errors]
      properties:
        success: { type: boolean }
        data: {}
        message: { type: [string, 'null'] }
        errors:
          type: array
          items:
            type: object
            required: [campo, codigo, detalhe]
            properties:
              campo: { type: string }
              codigo: { type: string }
              detalhe: { type: string }

    Pagina:
      type: object
      required: [itens, pagina, tamanho, total]
      properties:
        itens: { type: array, items: {} }
        pagina: { type: integer, example: 0 }
        tamanho: { type: integer, example: 20 }
        total: { type: integer, example: 137 }

    Chamado:
      type: object
      required: [id, numero, tipo, prioridade, status, assunto, criadoEm]
      properties:
        id: { type: string, format: uuid, example: 5c2d9e1a-0f3b-4b7e-9a6d-1e2f3a4b5c6d }
        numero: { type: integer, description: 'Sequencial por tenant, exibido ao usuário', example: 1042 }
        tipo:
          type: string
          enum: [interno, cliente]
          description: |
            `interno` — solicitante é usuário do sistema, sem empresa.
            `cliente` — solicitante é contato do CRM, com empresa obrigatória.
          example: cliente
        solicitanteUsuarioId:
          type: [string, 'null']
          format: uuid
          description: Referência a `identity.usuarios`. Preenchido apenas quando `tipo` é `interno`.
        empresaId:
          type: [string, 'null']
          format: uuid
          description: Referência a `crm.empresas`. Obrigatório quando `tipo` é `cliente`.
        empresaNome:
          type: [string, 'null']
          description: Razão social copiada na abertura do chamado, conforme §9.5 do Contrato.
          example: Centinela Soluções LTDA
        solicitanteContatoId:
          type: [string, 'null']
          format: uuid
          description: Referência a `crm.contatos`.
        categoriaId: { type: string, format: uuid }
        prioridade:
          type: string
          enum: [baixa, media, alta, critica]
          example: alta
        servicoId:
          type: [string, 'null']
          format: uuid
          description: Serviço contratado ao qual o chamado se refere. Módulo dono ainda não definido.
        contratoId:
          type: [string, 'null']
          format: uuid
          description: Referência a `contratos.contratos`.
        tecnicoId:
          type: [string, 'null']
          format: uuid
          description: Técnico responsável. Nulo enquanto o chamado está em `novo`.
        status:
          type: string
          enum: [novo, em_atendimento, aguardando_cliente, aguardando_fornecedor, escalado, resolvido, fechado, reaberto]
          example: em_atendimento
        assunto: { type: string, maxLength: 200, example: Servidor de arquivos inacessível }
        descricao: { type: [string, 'null'], maxLength: 8000 }
        solucao:
          type: [string, 'null']
          maxLength: 8000
          description: Obrigatório ao resolver o chamado.
        documentoIds:
          type: array
          description: Anexos, referenciados por UUID no serviço de documentos.
          items: { type: string, format: uuid }
        politicaSlaId: { type: [string, 'null'], format: uuid }
        prazoPrimeiraRespostaMinutos:
          type: [integer, 'null']
          description: Congelado na abertura. Não muda se a política mudar depois.
          example: 60
        prazoResolucaoMinutos: { type: [integer, 'null'], example: 480 }
        vencePrimeiraRespostaEm:
          type: [string, 'null']
          format: date-time
          description: Empurrado a cada retomada, pelo tempo que o chamado ficou pausado.
        venceResolucaoEm: { type: [string, 'null'], format: date-time }
        primeiraRespostaEm:
          type: [string, 'null']
          format: date-time
          description: Primeira interação pública de um técnico. Nota interna não conta.
        resolvidoEm: { type: [string, 'null'], format: date-time }
        fechadoEm: { type: [string, 'null'], format: date-time }
        tempoPausadoMinutos: { type: integer, default: 0, example: 0 }
        tempoTrabalhadoMinutos:
          type: integer
          description: Soma dos apontamentos do chamado.
          default: 0
          example: 45
        reaberturas: { type: integer, default: 0, example: 0 }
        criadoEm: { type: string, format: date-time, example: '2026-09-17T13:02:11Z' }
        atualizadoEm: { type: [string, 'null'], format: date-time }

    ChamadoResumo:
      type: object
      required: [id, numero, assunto, status, prioridade, criadoEm]
      properties:
        id: { type: string, format: uuid, example: 5c2d9e1a-0f3b-4b7e-9a6d-1e2f3a4b5c6d }
        numero: { type: integer, example: 1042 }
        assunto: { type: string, example: Servidor de arquivos inacessível }
        status:
          type: string
          enum: [novo, em_atendimento, aguardando_cliente, aguardando_fornecedor, escalado, resolvido, fechado, reaberto]
          example: em_atendimento
        prioridade: { type: string, enum: [baixa, media, alta, critica], example: alta }
        tecnicoId: { type: [string, 'null'], format: uuid }
        venceResolucaoEm: { type: [string, 'null'], format: date-time }
        criadoEm: { type: string, format: date-time, example: '2026-09-17T13:02:11Z' }

    NovoChamado:
      type: object
      required: [tipo, categoriaId, prioridade, assunto]
      description: |
        `tipo` decide quais campos são obrigatórios: `interno` exige `solicitanteUsuarioId` e recusa
        `empresaId`; `cliente` exige `empresaId`. Incoerência responde 400.
      properties:
        tipo: { type: string, enum: [interno, cliente], example: cliente }
        solicitanteUsuarioId: { type: [string, 'null'], format: uuid }
        empresaId: { type: [string, 'null'], format: uuid }
        solicitanteContatoId: { type: [string, 'null'], format: uuid }
        categoriaId: { type: string, format: uuid }
        prioridade: { type: string, enum: [baixa, media, alta, critica], example: alta }
        servicoId: { type: [string, 'null'], format: uuid }
        contratoId: { type: [string, 'null'], format: uuid }
        assunto: { type: string, minLength: 1, maxLength: 200, example: Servidor de arquivos inacessível }
        descricao:
          type: [string, 'null']
          maxLength: 8000
          example: Desde as 9h ninguém acessa a pasta compartilhada.
        documentoIds: { type: array, items: { type: string, format: uuid } }

    AtualizarChamado:
      type: object
      description: |
        Não altera `status`. Mudança de estado acontece apenas pelas rotas de transição — se este corpo
        aceitasse o campo, as regras de transição deixariam de valer.
      properties:
        categoriaId: { type: string, format: uuid }
        prioridade: { type: string, enum: [baixa, media, alta, critica], example: alta }
        servicoId: { type: [string, 'null'], format: uuid }
        contratoId: { type: [string, 'null'], format: uuid }
        assunto: { type: string, minLength: 1, maxLength: 200, example: Servidor de arquivos inacessível }
        descricao: { type: [string, 'null'], maxLength: 8000 }
        documentoIds: { type: array, items: { type: string, format: uuid } }
