      operationId: desvincularContratoSla
      summary: Remover o vínculo do contrato
      description: |
        Exige `chamados.configuracao.administrar`. Chamados novos daquele contrato passam a usar a política
        padrão.
      responses:
        '200':
          description: Vínculo removido
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
