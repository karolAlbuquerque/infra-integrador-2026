        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /api/chamados/empresas/{id}/status-tecnico:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador da empresa no CRM
        schema: { type: string, format: uuid }
    get:
      tags: [integracao]
      operationId: verStatusTecnico
      summary: Status técnico de uma empresa
      description: |
        Exige `chamados.empresa.ver_resumo`, permissão fraca concedida a todo perfil operacional. Sem ela,
        a ficha de empresa do CRM quebraria com 403 — é o caso descrito no §9.3 do Contrato.
        Quem chama deve aplicar timeout de 3 segundos e degradar a tela em caso de falha (§9.6).

        **Sempre responde 200.** O Chamados não enxerga o schema do CRM, então um 404 só poderia significar
        "empresa sem chamado", e a ficha o leria como erro. Empresa sem chamado — ou que nem existe —
        volta `ok` com os contadores zerados. A regra do status está no schema `StatusTecnico`.
      responses:
        '200':
          description: Status técnico
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/StatusTecnico' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /api/chamados/empresas/status-tecnico:
    get:
      tags: [integracao]
      operationId: verStatusTecnicoEmLote
      summary: Status técnico de várias empresas
      description: |
        Exige `chamados.empresa.ver_resumo`. Existe porque uma listagem de empresas no CRM faria uma
        chamada por linha sem ela (§9.4). Devolve um item para cada id pedido, na ordem do pedido — empresa
        sem chamado volta `ok` com os contadores zerados, como na consulta individual.
      parameters:
        - name: ids
          in: query
          required: true
          description: Identificadores separados por vírgula, no máximo 100
          schema:
            type: array
            maxItems: 100
            items: { type: string, format: uuid }
          style: form
          explode: false
      responses:
        '200':
          description: Lista de status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/StatusTecnico' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /api/chamados/busca:
    get:
      tags: [integracao]
      operationId: buscar
      summary: Busca global do módulo
      description: |
        Exige `chamados.chamado.ver`. Consumido pela casca para a caixa de busca do topo. Devolve no
        máximo cinco resultados.
      parameters:
        - name: q
          in: query
          required: true
          description: Termo buscado, no número ou no assunto do chamado
          schema: { type: string, minLength: 2, maxLength: 120 }
      responses:
        '200':
          description: Até cinco resultados
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        maxItems: 5
                        items: { $ref: '#/components/schemas/ResultadoBusca' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /api/chamados/relatorios/chamados:
    get:
      tags: [relatorios]
      operationId: relatorioChamados
      summary: Chamados por status, categoria e prioridade no período
      description: Exige `chamados.relatorio.ver`.
      parameters:
        - $ref: '#/components/parameters/RelatorioDe'
        - $ref: '#/components/parameters/RelatorioAte'
        - $ref: '#/components/parameters/RelatorioEmpresaId'
        - $ref: '#/components/parameters/RelatorioCategoriaId'
        - name: agruparPor
          in: query
          description: Dimensão do agrupamento
          schema: { type: string, enum: [status, categoria, prioridade, empresa], default: status }
      responses:
        '200':
          description: Linhas do relatório
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LinhaRelatorio' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /api/chamados/relatorios/sla:
    get:
      tags: [relatorios]
      operationId: relatorioSla
      summary: Chamados dentro e fora do SLA
      description: |
        Exige `chamados.relatorio.ver`. Uma linha para cada um dos três prazos da §45 — `primeira_resposta`,
        `inicio_atendimento` e `resolucao` —, comparando o momento cumprido (`primeiraRespostaEm`,
        `atendimentoIniciadoEm`, `resolvidoEm`) com o respectivo `vence…Em`, já descontadas as pausas.
        `valor` é o percentual dentro do prazo; `detalhe` traz `dentroSla` e `foraSla`.
      parameters:
        - $ref: '#/components/parameters/RelatorioDe'
        - $ref: '#/components/parameters/RelatorioAte'
        - $ref: '#/components/parameters/RelatorioEmpresaId'
        - $ref: '#/components/parameters/RelatorioTecnicoId'
      responses:
        '200':
          description: Linhas do relatório
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LinhaRelatorio' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /api/chamados/relatorios/tempo-resposta:
    get:
      tags: [relatorios]
      operationId: relatorioTempoResposta
      summary: Tempo médio de primeira resposta
      description: |
        Exige `chamados.relatorio.ver`. Valor em minutos, contando de `criadoEm` até `primeiraRespostaEm`,
        descontadas as pausas.
      parameters:
        - $ref: '#/components/parameters/RelatorioDe'
        - $ref: '#/components/parameters/RelatorioAte'
        - $ref: '#/components/parameters/RelatorioEmpresaId'
        - $ref: '#/components/parameters/RelatorioTecnicoId'
      responses:
        '200':
          description: Linhas do relatório
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LinhaRelatorio' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /api/chamados/relatorios/tempo-solucao:
    get:
      tags: [relatorios]
      operationId: relatorioTempoSolucao
      summary: Tempo médio de resolução
      description: |
        Exige `chamados.relatorio.ver`. Valor em minutos, de `criadoEm` até `resolvidoEm`, descontadas as
        pausas.
      parameters:
        - $ref: '#/components/parameters/RelatorioDe'
        - $ref: '#/components/parameters/RelatorioAte'
        - $ref: '#/components/parameters/RelatorioEmpresaId'
        - $ref: '#/components/parameters/RelatorioTecnicoId'
      responses:
        '200':
          description: Linhas do relatório
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LinhaRelatorio' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /api/chamados/relatorios/horas-por-cliente:
    get:
      tags: [relatorios]
      operationId: relatorioHorasPorCliente
      summary: Horas trabalhadas por empresa
      description: |
        Exige `chamados.relatorio.ver`. Soma dos apontamentos, agrupada por empresa. Valor em minutos.
      parameters:
        - $ref: '#/components/parameters/RelatorioDe'
        - $ref: '#/components/parameters/RelatorioAte'
        - $ref: '#/components/parameters/RelatorioEmpresaId'
      responses:
        '200':
          description: Linhas do relatório
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LinhaRelatorio' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /api/chamados/relatorios/chamados-por-tecnico:
    get:
      tags: [relatorios]
      operationId: relatorioChamadosPorTecnico
      summary: Volume e desempenho por técnico
      description: |
        Exige `chamados.relatorio.ver`. `detalhe` traz resolvidos, reabertos e minutos apontados.
      parameters:
        - $ref: '#/components/parameters/RelatorioDe'
        - $ref: '#/components/parameters/RelatorioAte'
        - $ref: '#/components/parameters/RelatorioTecnicoId'
      responses:
        '200':
          description: Linhas do relatório
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LinhaRelatorio' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /api/chamados/relatorios/problemas-recorrentes:
    get:
      tags: [relatorios]
      operationId: relatorioProblemasRecorrentes
      summary: Categorias com maior reincidência
      description: |
        Exige `chamados.relatorio.ver`. Agrupa por categoria e empresa, destacando reaberturas — é o que
        identifica problema tratado como incidente quando deveria ser tratado como causa.
      parameters:
        - $ref: '#/components/parameters/RelatorioDe'
        - $ref: '#/components/parameters/RelatorioAte'
        - $ref: '#/components/parameters/RelatorioEmpresaId'
        - name: minimoOcorrencias
          in: query
          description: Ignora agrupamentos com menos ocorrências que este número
          schema: { type: integer, minimum: 2, default: 3 }
      responses:
        '200':
          description: Linhas do relatório
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LinhaRelatorio' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /api/chamados/relatorios/{relatorio}/exportar:
    parameters:
      - name: relatorio
        in: path
        required: true
        description: Qual dos relatórios técnicos exportar — o mesmo nome da rota de consulta
        schema:
          type: string
          enum: [chamados, sla, tempo-resposta, tempo-solucao, horas-por-cliente, chamados-por-tecnico, problemas-recorrentes]
    get:
      tags: [relatorios]
      operationId: exportarRelatorio
      summary: Exportar um relatório técnico em PDF, XLSX ou CSV
      description: |
        Exige `chamados.relatorio.exportar`. Exceção do envelope prevista no §8.2 do Contrato: o sucesso é o
        próprio arquivo, com `Content-Type` e `Content-Disposition`; os erros continuam no envelope.

        Aceita os mesmos filtros da rota de consulta do relatório. Filtro que aquele relatório não usa
        responde 400 — ignorá-lo em silêncio geraria um arquivo diferente do que o usuário pediu.

        O front chama com `fetch`, com o token no cabeçalho, e salva o `blob`. O token nunca vai na URL.
      parameters:
        - name: formato
          in: query
          required: true
          description: Formato do arquivo
          schema: { type: string, enum: [pdf, xlsx, csv] }
        - $ref: '#/components/parameters/RelatorioDe'
        - $ref: '#/components/parameters/RelatorioAte'
        - $ref: '#/components/parameters/RelatorioEmpresaId'
        - $ref: '#/components/parameters/RelatorioTecnicoId'
        - $ref: '#/components/parameters/RelatorioCategoriaId'
        - name: agruparPor
          in: query
          description: Só no relatório `chamados`
          schema: { type: string, enum: [status, categoria, prioridade, empresa], default: status }
        - name: minimoOcorrencias
          in: query
          description: Só no relatório `problemas-recorrentes`
          schema: { type: integer, minimum: 2, default: 3 }
      responses:
        '200':
          description: O arquivo, fora do envelope
          headers:
            Content-Disposition:
              description: Nome sugerido do arquivo
              schema: { type: string, example: 'attachment; filename="sla-2026-09.xlsx"' }
          content:
            application/pdf:
              schema: { type: string, format: binary }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
            text/csv:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /api/chamados/health:
    get:
      tags: [saude]
      operationId: saude
      summary: Serviço de pé e conectado ao banco
      description: Não exige token. Usado pela casca para avisar que o módulo está indisponível.
      security: []
      responses:
        '200':
          description: Disponível
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
              example: { success: true, data: { status: UP }, message: null, errors: [] }
        '503':
          description: Banco indisponível
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Pagina:
      name: pagina
      in: query
      description: Página, começando em zero
      schema: { type: integer, minimum: 0, default: 0 }
    Tamanho:
      name: tamanho
      in: query
      description: Itens por página, no máximo 100
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    RelatorioDe:
      name: de
      in: query
      required: true
      description: Início do período, inclusive
      schema: { type: string, format: date, example: '2026-09-01' }
    RelatorioAte:
      name: ate
      in: query
      required: true
      description: Fim do período, inclusive
      schema: { type: string, format: date, example: '2026-09-30' }
    RelatorioEmpresaId:
      name: empresaId
      in: query
      description: Restringe a uma empresa do CRM
      schema: { type: string, format: uuid }
    RelatorioTecnicoId:
      name: tecnicoId
      in: query
      description: Restringe a um técnico
      schema: { type: string, format: uuid }
    RelatorioCategoriaId:
      name: categoriaId
      in: query
      description: Restringe a uma categoria
      schema: { type: string, format: uuid }

  responses:
    DadosInvalidos:
      description: Dado inválido
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
          example:
            success: false
            data: null
            message: Não foi possível salvar o chamado.
            errors:
              - { campo: assunto, codigo: CAMPO_INVALIDO, detalhe: Informe o assunto. }
    NaoAutenticado:
      description: Sem token, token inválido ou expirado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    SemPermissao:
      description: Sem a permissão exigida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    NaoEncontrado:
      description: Não existe ou pertence a outro tenant
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
    EstadoInvalido:
      description: A transição não é válida para o estado atual do chamado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
          example:
            success: false
            data: null
            message: Não é possível fechar um chamado que ainda não foi resolvido.
            errors:
              - { campo: status, codigo: TRANSICAO_INVALIDA, detalhe: 'De resolvido só se vai para fechado ou reaberto.' }

  schemas:
    Envelope:
      type: object
      required: [success, data, message, errors]
      properties:
        success: { type: boolean }
        data: {}
        message: { type: [string, 'null'] }
        errors:
          type: array
          items:
            type: object
            required: [campo, codigo, detalhe]
            properties:
              campo: { type: string }
              codigo: { type: string }
              detalhe: { type: string }

    Pagina:
      type: object
      required: [itens, pagina, tamanho, total]
      properties:
        itens: { type: array, items: {} }
        pagina: { type: integer, example: 0 }
        tamanho: { type: integer, example: 20 }
        total: { type: integer, example: 137 }

    Chamado:
      type: object
      required: [id, numero, tipo, prioridade, status, assunto, criadoEm]
      properties:
        id: { type: string, format: uuid, example: 5c2d9e1a-0f3b-4b7e-9a6d-1e2f3a4b5c6d }
        numero: { type: integer, description: 'Sequencial por tenant, exibido ao usuário', example: 1042 }
        tipo:
          type: string
          enum: [interno, cliente]
          description: |
            `interno` — solicitante é usuário do sistema, sem empresa.
            `cliente` — solicitante é contato do CRM, com empresa obrigatória.
          example: cliente
        solicitanteUsuarioId:
          type: [string, 'null']
          format: uuid
          description: Referência a `identity.usuarios`. Preenchido apenas quando `tipo` é `interno`.
        empresaId:
          type: [string, 'null']
          format: uuid
          description: Referência a `crm.empresas`. Obrigatório quando `tipo` é `cliente`.
        empresaNome:
          type: [string, 'null']
          description: Razão social copiada na abertura do chamado, conforme §9.5 do Contrato.
          example: Centinela Soluções LTDA
        solicitanteContatoId:
          type: [string, 'null']
          format: uuid
          description: Referência a `crm.contatos`.
        categoriaId: { type: string, format: uuid }
        prioridade:
          type: string
          enum: [baixa, media, alta, critica]
          example: alta
        servicoId:
          type: [string, 'null']
          format: uuid
          description: Serviço contratado ao qual o chamado se refere. Módulo dono ainda não definido.
        contratoId:
          type: [string, 'null']
          format: uuid
          description: Referência a `contratos.contratos`.
        tecnicoId:
          type: [string, 'null']
          format: uuid
          description: Técnico responsável. Nulo enquanto o chamado está em `novo`.
        status:
          type: string
          enum: [novo, em_atendimento, aguardando_cliente, aguardando_fornecedor, escalado, resolvido, fechado, reaberto]
          example: em_atendimento
        assunto: { type: string, maxLength: 200, example: Servidor de arquivos inacessível }
        descricao: { type: [string, 'null'], maxLength: 8000 }
        solucao:
          type: [string, 'null']
          maxLength: 8000
          description: Obrigatório ao resolver o chamado.
        documentoIds:
          type: array
          description: Anexos, referenciados por UUID no serviço de documentos.
          items: { type: string, format: uuid }
        politicaSlaId: { type: [string, 'null'], format: uuid }
        prazoPrimeiraRespostaMinutos:
          type: [integer, 'null']
          description: |
            Congelado na abertura. Não muda se a política mudar depois; muda só se o próprio chamado mudar de
            prioridade ou de contrato (ver `editarChamado`).
          example: 60
        prazoInicioAtendimentoMinutos: { type: [integer, 'null'], example: 120 }
        prazoResolucaoMinutos: { type: [integer, 'null'], example: 480 }
        vencePrimeiraRespostaEm:
          type: [string, 'null']
          format: date-time
          description: Empurrado a cada retomada, pelo tempo que o chamado ficou pausado.
        venceInicioAtendimentoEm: { type: [string, 'null'], format: date-time }
        venceResolucaoEm: { type: [string, 'null'], format: date-time }
        primeiraRespostaEm:
          type: [string, 'null']
          format: date-time
          description: Primeira interação pública de um técnico. Nota interna não conta.
        atendimentoIniciadoEm:
          type: [string, 'null']
          format: date-time
          description: Primeira atribuição, quando o chamado entra em `em_atendimento`.
        resolvidoEm: { type: [string, 'null'], format: date-time }
        fechadoEm: { type: [string, 'null'], format: date-time }
        tempoPausadoMinutos: { type: integer, default: 0, example: 0 }
        tempoTrabalhadoMinutos:
          type: integer
          description: Soma dos apontamentos do chamado.
          default: 0
          example: 45
        reaberturas: { type: integer, default: 0, example: 0 }
        criadoEm: { type: string, format: date-time, example: '2026-09-17T13:02:11Z' }
        atualizadoEm: { type: [string, 'null'], format: date-time }

    ChamadoResumo:
      type: object
      required: [id, numero, assunto, status, prioridade, criadoEm]
      properties:
        id: { type: string, format: uuid, example: 5c2d9e1a-0f3b-4b7e-9a6d-1e2f3a4b5c6d }
        numero: { type: integer, example: 1042 }
        assunto: { type: string, example: Servidor de arquivos inacessível }
        status:
          type: string
          enum: [novo, em_atendimento, aguardando_cliente, aguardando_fornecedor, escalado, resolvido, fechado, reaberto]
          example: em_atendimento
        prioridade: { type: string, enum: [baixa, media, alta, critica], example: alta }
        tecnicoId: { type: [string, 'null'], format: uuid }
        venceResolucaoEm: { type: [string, 'null'], format: date-time }
        criadoEm: { type: string, format: date-time, example: '2026-09-17T13:02:11Z' }

    NovoChamado:
      type: object
      required: [tipo, categoriaId, prioridade, assunto]
      description: |
        `tipo` decide quais campos são obrigatórios: `interno` exige `solicitanteUsuarioId` e recusa
        `empresaId`; `cliente` exige `empresaId`. Incoerência responde 400.
      properties:
        tipo: { type: string, enum: [interno, cliente], example: cliente }
        solicitanteUsuarioId: { type: [string, 'null'], format: uuid }
        empresaId: { type: [string, 'null'], format: uuid }
        solicitanteContatoId: { type: [string, 'null'], format: uuid }
        categoriaId: { type: string, format: uuid }
        prioridade: { type: string, enum: [baixa, media, alta, critica], example: alta }
        servicoId: { type: [string, 'null'], format: uuid }
        contratoId: { type: [string, 'null'], format: uuid }
        assunto: { type: string, minLength: 1, maxLength: 200, example: Servidor de arquivos inacessível }
        descricao:
          type: [string, 'null']
          maxLength: 8000
          example: Desde as 9h ninguém acessa a pasta compartilhada.
        documentoIds: { type: array, items: { type: string, format: uuid } }

    AtualizarChamado:
      type: object
      description: |
        Não altera `status`. Mudança de estado acontece apenas pelas rotas de transição — se este corpo
        aceitasse o campo, as regras de transição deixariam de valer.
      properties:
        categoriaId: { type: string, format: uuid }
        prioridade: { type: string, enum: [baixa, media, alta, critica], example: alta }
        servicoId: { type: [string, 'null'], format: uuid }
        contratoId: { type: [string, 'null'], format: uuid }
        assunto: { type: string, minLength: 1, maxLength: 200, example: Servidor de arquivos inacessível }
        descricao: { type: [string, 'null'], maxLength: 8000 }
        documentoIds: { type: array, items: { type: string, format: uuid } }

    AtribuirRequest:
      type: object
      required: [tecnicoId]
      properties:
        tecnicoId:
          type: string
          format: uuid
          description: Usuário do identity que passa a ser responsável.

    MotivoRequest:
      type: object
      required: [motivo]
      properties:
        motivo:
          type: string
          minLength: 3
          maxLength: 500
          example: Aguardando o cliente informar o horário de acesso.

    EscalarRequest:
      type: object
      required: [motivo, destino]
      properties:
        motivo:
          type: string
          minLength: 3
          maxLength: 500
          example: Depende de intervenção do fabricante.
        destino: { type: string, minLength: 2, maxLength: 120, example: Suporte nível 2 }

    ResolverRequest:
      type: object
      required: [solucao]
      properties:
        solucao:
          type: string
          minLength: 3
          maxLength: 8000
          example: Serviço de arquivos reiniciado e permissões corrigidas.

    Interacao:
      type: object
      required: [id, visibilidade, autorUsuarioId, texto, criadoEm]
      properties:
        id: { type: string, format: uuid, example: 3f8e1c2b-9a7d-4e6f-8b5a-2c1d0e9f8a7b }
        visibilidade:
          type: string
          enum: [interna, publica]
          description: |
            `interna` — só a equipe vê. `publica` — o solicitante vê, e é a que marca a primeira resposta
            do SLA.
          example: publica
        autorUsuarioId: { type: string, format: uuid }
        texto:
          type: string
          example: Reiniciamos o serviço e pedimos que o cliente teste novamente.
        documentoIds: { type: array, items: { type: string, format: uuid } }
        criadoEm: { type: string, format: date-time, example: '2026-09-17T13:40:00Z' }

    NovaInteracao:
      type: object
      required: [visibilidade, texto]
      properties:
        visibilidade: { type: string, enum: [interna, publica], example: publica }
        texto:
          type: string
          minLength: 1
          maxLength: 8000
          example: Reiniciamos o serviço e pedimos que o cliente teste novamente.
        documentoIds: { type: array, items: { type: string, format: uuid } }

    Apontamento:
      type: object
      required: [id, usuarioId, minutos, data, criadoEm]
      properties:
        id: { type: string, format: uuid, example: 8b5a2c1d-0e9f-4a7b-9c3d-1e2f3a4b5c6d }
        usuarioId: { type: string, format: uuid }
        minutos: { type: integer, minimum: 1, example: 45 }
        descricao:
          type: [string, 'null']
          maxLength: 500
          example: Diagnóstico remoto e correção de permissões.
        data: { type: string, format: date, example: '2026-09-17' }
        criadoEm: { type: string, format: date-time, example: '2026-09-17T13:45:00Z' }

    NovoApontamento:
      type: object
      required: [minutos, data]
      properties:
        minutos: { type: integer, minimum: 1, maximum: 1440, example: 45 }
        descricao:
          type: [string, 'null']
          maxLength: 500
          example: Diagnóstico remoto e correção de permissões.
        data: { type: string, format: date, example: '2026-09-17' }

    Transicao:
      type: object
      required: [id, paraStatus, usuarioId, ocorridoEm]
      properties:
        id: { type: string, format: uuid, example: 1e2f3a4b-5c6d-4e7f-8a9b-0c1d2e3f4a5b }
        deStatus:
          type: [string, 'null']
          enum: [novo, em_atendimento, aguardando_cliente, aguardando_fornecedor, escalado, resolvido, fechado, reaberto, null]
          description: Nulo na abertura do chamado.
          example: novo
        paraStatus:
          type: string
          enum: [novo, em_atendimento, aguardando_cliente, aguardando_fornecedor, escalado, resolvido, fechado, reaberto]
          example: em_atendimento
        usuarioId: { type: string, format: uuid }
        tecnicoId:
          type: [string, 'null']
          format: uuid
          description: |
            Técnico responsável depois da transição. Numa reatribuição, `deStatus` e `paraStatus` são iguais
            e só este campo muda.
        motivo: { type: [string, 'null'], maxLength: 500 }
        ocorridoEm: { type: string, format: date-time, example: '2026-09-17T13:20:00Z' }

    Categoria:
      type: object
      required: [id, nome, ativo]
      properties:
        id: { type: string, format: uuid, example: 7a1b2c3d-4e5f-4a7b-8c9d-0e1f2a3b4c5d }
        nome: { type: string, example: Infraestrutura }
        descricao: { type: [string, 'null'], maxLength: 500 }
        ativo: { type: boolean, default: true, example: true }

    NovaCategoria:
      type: object
      required: [nome]
      properties:
        nome: { type: string, minLength: 2, maxLength: 120, example: Infraestrutura }
        descricao: { type: [string, 'null'], maxLength: 500 }
        ativo: { type: boolean, default: true, example: true }

    PoliticaSla:
      allOf:
        - type: object
          required: [id]
          properties:
            id: { type: string, format: uuid, example: 9f1c4e2a-3b5d-4c7e-8a9b-0c1d2e3f4a5b }
        - $ref: '#/components/schemas/NovaPoliticaSla'

    NovaPoliticaSla:
      type: object
      required: [nome, prazos, regime]
      description: |
        No regime `comercial`, `fusoHorario`, `expedienteDias`, `expedienteInicio` e `expedienteFim` são
        obrigatórios — sem eles não há como saber quando o relógio corre. No regime `corrido`, são ignorados.
      properties:
        nome: { type: string, minLength: 2, maxLength: 120, example: Premium 24x7 }
        prazos:
          type: array
          description: Um prazo para cada uma das quatro prioridades, sem repetir.
          minItems: 4
          maxItems: 4
          items: { $ref: '#/components/schemas/PrazoSla' }
          example:
            - { prioridade: baixa, primeiraRespostaMinutos: 240, inicioAtendimentoMinutos: 480, resolucaoMinutos: 2880 }
            - { prioridade: media, primeiraRespostaMinutos: 120, inicioAtendimentoMinutos: 240, resolucaoMinutos: 1440 }
            - { prioridade: alta, primeiraRespostaMinutos: 60, inicioAtendimentoMinutos: 120, resolucaoMinutos: 480 }
            - { prioridade: critica, primeiraRespostaMinutos: 15, inicioAtendimentoMinutos: 30, resolucaoMinutos: 240 }
        regime:
          type: string
          enum: [corrido, comercial]
          description: |
            `corrido` conta 24 horas por dia. `comercial` conta apenas dentro do expediente configurado.
            Feriados não são considerados em nenhum dos dois — decisão registrada na spec.
          example: comercial
        fusoHorario:
          type: [string, 'null']
          description: Fuso do expediente, no formato IANA. Os horários de `expedienteInicio` e `expedienteFim` estão nele.
          example: America/Sao_Paulo
        expedienteDias:
          type: array
          description: Dias da semana do expediente, de 1 (segunda) a 7 (domingo).
          items: { type: integer, minimum: 1, maximum: 7 }
          uniqueItems: true
          example: [1, 2, 3, 4, 5]
        expedienteInicio:
          type: [string, 'null']
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '08:00'
        expedienteFim:
          type: [string, 'null']
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '18:00'
        padrao:
          type: boolean
          description: Política aplicada a chamado sem contrato vinculado, incluindo todo chamado interno.
          default: false
          example: false
      if:
        properties:
          regime: { const: comercial }
        required: [regime]
      then:
        required: [fusoHorario, expedienteDias, expedienteInicio, expedienteFim]
        properties:
          fusoHorario: { type: string }
          expedienteDias: { minItems: 1 }
          expedienteInicio: { type: string }
          expedienteFim: { type: string }

    PrazoSla:
      type: object
      required: [prioridade, primeiraRespostaMinutos, inicioAtendimentoMinutos, resolucaoMinutos]
      description: |
        Os três tempos da §45, todos contados a partir da abertura e descontadas as pausas:
        até a primeira resposta pública, até o início do atendimento (primeira atribuição) e até a
        resolução.
      properties:
        prioridade: { type: string, enum: [baixa, media, alta, critica], example: critica }
        primeiraRespostaMinutos: { type: integer, minimum: 1, example: 15 }
        inicioAtendimentoMinutos: { type: integer, minimum: 1, example: 30 }
        resolucaoMinutos: { type: integer, minimum: 1, example: 240 }

    VinculoContratoSla:
      type: object
      required: [contratoId, politicaId]
      properties:
        contratoId:
          type: string
          format: uuid
          description: Referência a `contratos.contratos`, guardada sem chave estrangeira.
        politicaId: { type: string, format: uuid }

    NovoVinculoContratoSla:
      type: object
      required: [contratoId, politicaId]
      properties:
        contratoId: { type: string, format: uuid }
        politicaId: { type: string, format: uuid }

    StatusTecnico:
      type: object
      required: [empresaId, status, chamadosAbertos, criticosAbertos, foraSla, vencendo24h, atualizadoEm]
      properties:
        empresaId: { type: string, format: uuid, example: be80e43d-cac3-41ff-895b-7125637878f7 }
        status:
          type: string
          enum: [ok, atencao, critico]
          description: |
            Um dos quatro status exibidos na ficha de empresa do CRM, conforme §10.4 do Contrato. Conta só
            chamados em aberto — qualquer status que não seja `resolvido` nem `fechado`.

            - `critico` — ao menos um chamado de prioridade `critica` (`criticosAbertos > 0`) ou com o prazo
              de resolução vencido (`foraSla > 0`).
            - `atencao` — não é crítico, mas ao menos um chamado de prioridade `alta` ou com o prazo de
              resolução vencendo nas próximas 24 horas (`vencendo24h > 0`).
            - `ok` — nenhum dos dois casos, inclusive a empresa sem chamado.
          example: atencao
        chamadosAbertos: { type: integer, minimum: 0, example: 3 }
        criticosAbertos:
          type: integer
          minimum: 0
          description: Chamados em aberto com prioridade `critica`.
          example: 0
        foraSla:
          type: integer
          minimum: 0
          description: Chamados em aberto com prazo de resolução vencido.
          example: 0
        vencendo24h:
          type: integer
          minimum: 0
          description: Chamados em aberto cujo prazo de resolução vence nas próximas 24 horas.
          example: 1
        atualizadoEm: { type: string, format: date-time, example: '2026-09-17T14:00:00Z' }

    ResultadoBusca:
      type: object
      required: [id, titulo, subtitulo, rota]
      properties:
        id: { type: string, format: uuid, example: 5c2d9e1a-0f3b-4b7e-9a6d-1e2f3a4b5c6d }
        titulo: { type: string, example: '#1042 — Servidor de arquivos inacessível' }
        subtitulo: { type: string, example: 'Em atendimento · Centinela Soluções' }
        rota: { type: string, example: /chamados/5c2d9e1a-0f3b-4b7e-9a6d-1e2f3a4b5c6d }

    LinhaRelatorio:
      type: object
      required: [rotulo, valor]
      description: |
        Linha de resultado. `rotulo` é a chave do agrupamento — status, técnico, empresa, categoria —
        e `valor` é a medida do relatório. `detalhe` traz medidas auxiliares quando o relatório tem mais
        de uma coluna.
      properties:
        rotulo: { type: string, example: em_atendimento }
        valor: { type: number, example: 17 }
        detalhe:
          type: [object, 'null']
          additionalProperties: { type: number }
          example: { dentroSla: 15, foraSla: 2 }
