        Exige `chamados.chamado.ver`. O vínculo mora neste módulo de propósito: assim o módulo de Contratos
        não precisa conhecer as políticas nem criar campo para elas.
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: Página de vínculos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Pagina'
                          - properties:
                              itens:
                                type: array
                                items: { $ref: '#/components/schemas/VinculoContratoSla' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    post:
      tags: [cadastros]
      operationId: vincularContratoSla
      summary: Vincular contrato a uma política
      description: Exige `chamados.configuracao.administrar`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovoVinculoContratoSla' }
      responses:
        '201':
          description: Vínculo criado
          headers:
            Location:
              description: Endereço do vínculo criado
              schema: { type: string, example: /api/chamados/contratos-sla/2b7c9d1e-4f6a-4b8c-9d0e-1f2a3b4c5d6e }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/VinculoContratoSla' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '409':
          description: Este contrato já tem política vinculada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }

  /api/chamados/contratos-sla/{contratoId}:
    parameters:
      - name: contratoId
        in: path
        required: true
        description: Identificador do contrato no módulo de Contratos
        schema: { type: string, format: uuid }
    get:
      tags: [cadastros]
      operationId: verVinculoContratoSla
      summary: Ver a política vinculada a um contrato
      description: |
        Exige `chamados.chamado.ver`. É o endereço devolvido no `Location` de `vincularContratoSla`. Contrato
        sem vínculo responde 404 — os chamados dele usam a política padrão.
      responses:
        '200':
          description: Vínculo
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/VinculoContratoSla' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    delete:
