  /api/chamados/politicas-sla:
    get:
      tags: [cadastros]
      operationId: listarPoliticasSla
      summary: Listar políticas de SLA
      description: Exige `chamados.chamado.ver`.
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamanho'
      responses:
        '200':
          description: Página de políticas
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/Pagina'
                          - properties:
                              itens:
                                type: array
                                items: { $ref: '#/components/schemas/PoliticaSla' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    post:
      tags: [cadastros]
      operationId: criarPoliticaSla
      summary: Criar política de SLA
      description: |
        Exige `chamados.configuracao.administrar`. A política traz um prazo para cada uma das quatro
        prioridades em `prazos` — é o que deixa um único vínculo de contrato cobrir todas elas. Prioridade
        repetida ou faltando responde 400.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovaPoliticaSla' }
      responses:
        '201':
          description: Política criada
          headers:
            Location:
              description: Endereço da política criada
              schema: { type: string, example: /api/chamados/politicas-sla/9f1c4e2a-3b5d-4c7e-8a9b-0c1d2e3f4a5b }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/PoliticaSla' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /api/chamados/politicas-sla/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador da política
        schema: { type: string, format: uuid }
    put:
      tags: [cadastros]
      operationId: editarPoliticaSla
      summary: Editar política de SLA
      description: |
        Exige `chamados.configuracao.administrar`. Não afeta chamados já abertos: o prazo deles foi
        congelado na abertura.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NovaPoliticaSla' }
      responses:
        '200':
          description: Política atualizada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - properties:
                      data: { $ref: '#/components/schemas/PoliticaSla' }
        '400': { $ref: '#/components/responses/DadosInvalidos' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    delete:
      tags: [cadastros]
      operationId: excluirPoliticaSla
      summary: Excluir política de SLA (soft delete)
      description: Exige `chamados.configuracao.administrar`.
      responses:
        '200':
          description: Política excluída
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

