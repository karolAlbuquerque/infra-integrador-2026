        '429': { $ref: '#/components/responses/LimiteExcedido' }

  /public/landing/formularios/{chavePublica}/inicios:
    parameters:
      - $ref: '#/components/parameters/ChavePublica'
    post:
      tags: [Público — Chatbot e origem]
      summary: Registrar início de preenchimento
      description: |
        Chamado pelo `form.js` na primeira interação do visitante com um campo. Abandono =
        inícios sem conclusão no período.
      operationId: registrarInicioPreenchimento
      x-responsavel: Pablo Leandro Gloria
      x-situacao: previsto
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paginaSlug:
                  type: string
                  nullable: true
                  description: Slug da landing page, quando o formulário está dentro de uma.
                origem: { $ref: '#/components/schemas/Origem' }
      responses:
        '200': { $ref: '#/components/responses/SucessoSemDados' }
        '403': { $ref: '#/components/responses/DominioNaoAutorizado' }
        '404':
          description: Chave inexistente, formulário excluído ou inativo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeErro' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }

  /public/landing/formularios/{chavePublica}/sessoes:
    parameters:
      - $ref: '#/components/parameters/ChavePublica'
    post:
      tags: [Público — Chatbot e origem]
      summary: Iniciar conversa do chatbot
      description: |
        Cria a sessão no servidor e devolve a primeira pergunta. O `sessaoId` funciona como
        segredo da conversa: só quem o recebeu continua a sessão.
      operationId: iniciarSessaoChatbot
      x-responsavel: Pablo Leandro Gloria
      x-situacao: previsto
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                paginaSlug:
                  type: string
                  nullable: true
                origem: { $ref: '#/components/schemas/Origem' }
      responses:
        '201':
          description: Sessão criada
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PassoChatbot' }
        '403': { $ref: '#/components/responses/DominioNaoAutorizado' }
        '404':
          description: Formulário inexistente, inativo ou sem modo chatbot configurado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeErro' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }

  /public/landing/formularios/{chavePublica}/sessoes/{sessaoId}/respostas:
    parameters:
      - $ref: '#/components/parameters/ChavePublica'
      - $ref: '#/components/parameters/SessaoId'
    post:
      tags: [Público — Chatbot e origem]
      summary: Responder a pergunta atual (salvamento parcial)
      description: |
        Valida a resposta com as mesmas regras do formulário e grava na sessão. Assim que um
        e-mail ou telefone válido é obtido **e o consentimento já foi aceito**, o lead é
        considerado capturado e o evento `landing.chatbot.lead_capturado` é publicado, mesmo
        que a conversa não chegue ao fim.

        A resposta traz só a próxima pergunta — nunca as respostas já dadas.
      operationId: responderChatbot
      x-responsavel: Pablo Leandro Gloria
      x-situacao: previsto
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [campoId, valor]
              properties:
                campoId: { type: string, format: uuid }
                valor:
                  description: Texto, número, booleano ou lista, conforme o tipo do campo.
                  oneOf:
                    - type: string
                    - type: number
                    - type: boolean
                    - type: array
                      items: { type: string }
      responses:
        '200':
          description: Resposta aceita; próxima pergunta ou fim da conversa
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PassoChatbot' }
        '400':
          description: Valor inválido para o tipo do campo; a mesma pergunta deve ser repetida.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeErro' }
        '403': { $ref: '#/components/responses/DominioNaoAutorizado' }
        '404':
          description: Sessão inexistente, de outro formulário ou já concluída.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeErro' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }

  /public/landing/formularios/{chavePublica}/sessoes/{sessaoId}/consentimento:
    parameters:
      - $ref: '#/components/parameters/ChavePublica'
      - $ref: '#/components/parameters/SessaoId'
    post:
      tags: [Público — Chatbot e origem]
      summary: Registrar o aceite do consentimento na conversa
      description: |
        O widget pede o consentimento antes da primeira pergunta de contato (e-mail ou
        telefone). O texto gravado é o do formulário no momento do aceite.
      operationId: consentirChatbot
      x-responsavel: Pablo Leandro Gloria
      x-situacao: previsto
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [aceito]
              properties:
                aceito: { type: boolean, enum: [true] }
      responses:
        '200':
          description: Consentimento registrado; próxima pergunta
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PassoChatbot' }
        '400':
          description: '`aceito` diferente de `true` (`CONSENTIMENTO_OBRIGATORIO`).'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeErro' }
        '404':
          description: Sessão inexistente, de outro formulário ou já concluída.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeErro' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }

  /public/landing/formularios/{chavePublica}/sessoes/{sessaoId}/concluir:
    parameters:
      - $ref: '#/components/parameters/ChavePublica'
      - $ref: '#/components/parameters/SessaoId'
    post:
      tags: [Público — Chatbot e origem]
      summary: Concluir a conversa e gerar o envio
      description: |
        Monta o envio com as respostas da sessão e segue o mesmo caminho de
        `POST /public/landing/formularios/{chavePublica}/envios` (consentimento, validação,
        gravação e `landing.formulario.recebido`).
      operationId: concluirChatbot
      x-responsavel: Pablo Leandro Gloria
      x-situacao: previsto
      security: []
      responses:
        '200':
          description: Conversa concluída
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ConfirmacaoEnvio' }
        '400':
          description: Faltam respostas obrigatórias ou o consentimento (`CAMPO_OBRIGATORIO`, `CONSENTIMENTO_OBRIGATORIO`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeErro' }
        '404':
          description: Sessão inexistente, de outro formulário ou já concluída.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeErro' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token RS256 emitido pelo identity e validado pelo JWKS (§4.2).

  headers:
    Location:
      description: Caminho do recurso criado (§8.4).
      schema: { type: string }

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CampoId:
      name: campoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    BlocoId:
      name: blocoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SessaoId:
      name: sessaoId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ChavePublica:
      name: chavePublica
      in: path
      required: true
      description: Chave pública do formulário (no MR, `formKey`). Não é o id interno.
      schema: { type: string, example: "fk_7Gq2pX9a" }
    Slug:
      name: slug
      in: path
      required: true
      schema: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$', example: "black-friday-2026" }
    Pagina:
      name: pagina
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
    Tamanho:
      name: tamanho
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Ordenar:
      name: ordenar
      in: query
      description: '`campo,direcao`. Ex.: `criadoEm,desc`.'
      schema: { type: string, example: 'criadoEm,desc' }
    De:
      name: de
      in: query
      required: true
      schema: { type: string, format: date, example: '2026-09-01' }
    Ate:
      name: ate
      in: query
      required: true
      schema: { type: string, format: date, example: '2026-09-30' }
    FiltroPaginaId:
      name: paginaId
      in: query
      schema: { type: string, format: uuid }
    FiltroFormularioId:
      name: formularioId
      in: query
      schema: { type: string, format: uuid }
    FiltroCampanha:
      name: campanha
      in: query
      description: Valor de utm_campaign.
      schema: { type: string }

  responses:
    SucessoSemDados:
      description: Sucesso, sem dados de retorno
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Envelope' }
          example: { success: true, data: null, message: null, errors: [] }
    FormularioCriado:
      description: Formulário criado
      headers:
        Location: { $ref: '#/components/headers/Location' }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/Formulario' }
    CampoCriado:
      description: Campo criado
      headers:
        Location: { $ref: '#/components/headers/Location' }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/Campo' }
    PaginaCriada:
      description: Landing page criada
      headers:
        Location: { $ref: '#/components/headers/Location' }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/LandingPage' }
    BlocoCriado:
      description: Bloco criado
      headers:
        Location: { $ref: '#/components/headers/Location' }
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Envelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/Bloco' }
    ErroValidacao:
      description: Dado inválido; `errors` detalha campo a campo
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeErro' }
          example:
            success: false
            data: null
            message: Não foi possível salvar o formulário.
            errors:
              - campo: nome
                codigo: CAMPO_OBRIGATORIO
                detalhe: O nome do formulário é obrigatório.
    NaoAutenticado:
      description: Sem token, token inválido ou expirado
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeErro' }
          example: { success: false, data: null, message: "Sessão expirada.", errors: [] }
    SemPermissao:
      description: Autenticado, mas sem a permissão exigida
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeErro' }
          example: { success: false, data: null, message: "Você não tem permissão para esta ação.", errors: [] }
    NaoEncontrado:
      description: Não existe ou pertence a outro tenant (§8.4)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeErro' }
          example: { success: false, data: null, message: "Registro não encontrado.", errors: [] }
    SlugDuplicado:
      description: Slug já usado por outra landing page
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeErro' }
          example:
            success: false
            data: null
            message: Este endereço já está em uso.
            errors:
              - campo: slug
                codigo: SLUG_DUPLICADO
                detalhe: Escolha outro endereço para a página.
    DominioNaoAutorizado:
      description: Requisição vinda de um site fora da lista de domínios autorizados (RF27)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeErro' }
          example:
            success: false
            data: null
            message: Este formulário não pode ser usado neste site.
            errors:
              - campo: origem
                codigo: DOMINIO_NAO_AUTORIZADO
                detalhe: O domínio de origem não está autorizado.
    LimiteExcedido:
      description: Rate limit por IP da superfície pública (§12.6)
      headers:
        Retry-After:
          description: Segundos até poder tentar de novo.
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/EnvelopeErro' }
          example:
            success: false
            data: null
            message: Muitas tentativas. Aguarde um pouco e tente de novo.
            errors:
              - campo: ip
                codigo: LIMITE_EXCEDIDO
                detalhe: Limite de requisições por IP atingido.

  schemas:

    # ── Envelope (§8.2) ────────────────────────────────────────────────
    Envelope:
      type: object
      required: [success, data, message, errors]
      properties:
        success: { type: boolean }
        data:
          nullable: true
          description: Conteúdo da resposta; `null` em erro.
        message:
          type: string
          nullable: true
          description: Texto que pode ser mostrado ao usuário.
        errors:
          type: array
          items: { $ref: '#/components/schemas/Erro' }
    EnvelopeErro:
      allOf:
        - $ref: '#/components/schemas/Envelope'
        - type: object
          properties:
            success: { type: boolean, enum: [false] }
    Erro:
      type: object
      required: [campo, codigo, detalhe]
      properties:
        campo: { type: string, nullable: true, example: "nome" }
        codigo: { type: string, example: "CAMPO_OBRIGATORIO" }
        detalhe: { type: string }
    PaginaResultado:
      type: object
      required: [itens, pagina, tamanho, total]
      properties:
        itens: { type: array, items: {} }
        pagina: { type: integer, example: 0 }
        tamanho: { type: integer, example: 20 }
        total: { type: integer, example: 137 }
    Reordenacao:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          description: Todos os ids do conjunto, na nova ordem.
          items: { type: string, format: uuid }
    Auditoria:
      type: object
      properties:
        criadoEm: { type: string, format: date-time, readOnly: true }
        atualizadoEm: { type: string, format: date-time, readOnly: true }
        criadoPor: { type: string, format: uuid, readOnly: true }
        atualizadoPor: { type: string, format: uuid, readOnly: true }

    # ── Formulários (Camila) ───────────────────────────────────────────
    StatusFormulario:
      type: string
      enum: [ATIVO, INATIVO]
    ModoExibicao:
      type: string
      enum: [TRADICIONAL, PASSO_A_PASSO, CHATBOT]
      description: Tradicional = todos os campos; passo a passo = um por vez com barra de progresso; chatbot = conversa.
    TipoCampo:
      type: string
      enum: [TEXTO, TEXTO_LONGO, EMAIL, TELEFONE, CNPJ, CPF, NUMERO, DATA, LISTA_OPCOES, MULTIPLA_ESCOLHA, CAIXA_MARCACAO]
    FormularioEntrada:
      type: object
      required: [nome, modoExibicao]
      properties:
        nome: { type: string, maxLength: 120, example: "Contato — Black Friday" }
        descricao: { type: string, nullable: true, maxLength: 500 }
        modoExibicao: { $ref: '#/components/schemas/ModoExibicao' }
        textoConsentimento:
          type: string
          description: Texto LGPD mostrado ao visitante; o texto vigente no aceite é o que fica registrado no envio.
          example: Autorizo o uso dos meus dados para contato comercial, conforme a Política de Privacidade.
        mensagemSucesso: { type: string, nullable: true, example: "Recebemos seus dados. Em breve entraremos em contato." }
        urlRedirecionamento: { type: string, format: uri, nullable: true }
    FormularioResumo:
      type: object
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        status: { $ref: '#/components/schemas/StatusFormulario' }
        modoExibicao: { $ref: '#/components/schemas/ModoExibicao' }
        totalEnvios: { type: integer, readOnly: true }
        atualizadoEm: { type: string, format: date-time }
    Formulario:
      allOf:
        - type: object
          properties:
            id: { type: string, format: uuid, readOnly: true }
            chavePublica: { type: string, readOnly: true, example: "fk_7Gq2pX9a" }
            status: { $ref: '#/components/schemas/StatusFormulario' }
            campos:
              type: array
              readOnly: true
              items: { $ref: '#/components/schemas/Campo' }
        - $ref: '#/components/schemas/FormularioEntrada'
        - $ref: '#/components/schemas/Auditoria'
    CampoEntrada:
      type: object
      required: [rotulo, tipo, obrigatorio]
      properties:
        rotulo: { type: string, maxLength: 200, example: "Seu melhor e-mail" }
        tipo: { $ref: '#/components/schemas/TipoCampo' }
        obrigatorio: { type: boolean }
        placeholder: { type: string, nullable: true }
        opcoes:
          type: array
          nullable: true
          description: Só para LISTA_OPCOES e MULTIPLA_ESCOLHA.
          items: { type: string }
        mapeamentoCrm:
          type: string
          nullable: true
          description: |
            `crm_mapping` — campo do CRM que recebe o valor (ex. `contato.email`). Nulo = guardado
            só no envio. A lista de valores válidos depende do CRM e ainda não foi entregue.
          example: contato.email
    Campo:
      allOf:
        - type: object
          properties:
            id: { type: string, format: uuid, readOnly: true }
            ordem: { type: integer, readOnly: true }
        - $ref: '#/components/schemas/CampoEntrada'

    # ── Embed (Emmylio) ────────────────────────────────────────────────
    ConfiguracaoEmbed:
      type: object
      properties:
        chavePublica: { type: string, readOnly: true }
        codigoEmbed:
          type: string
          readOnly: true
          description: Trecho de HTML para colar no site externo.
        linkHospedado:
          type: string
          format: uri
          readOnly: true
          description: Página própria do formulário (tela 13).
        dominiosAutorizados:
          type: array
          items: { type: string }

    # ── Chatbot (Pablo) ────────────────────────────────────────────────
    ConfiguracaoChatbot:
      type: object
      required: [perguntas]
      properties:
        perguntas:
          type: array
          items:
            type: object
            required: [campoId, posicao, textoPergunta]
            properties:
              campoId: { type: string, format: uuid }
              posicao: { type: integer, minimum: 1 }
              textoPergunta: { type: string, maxLength: 300, example: "Qual é o seu melhor e-mail?" }
    PassoChatbot:
      type: object
      properties:
        sessaoId: { type: string, format: uuid }
        pedirConsentimento:
          type: boolean
          description: Verdadeiro quando a próxima etapa é o aceite do consentimento.
        textoConsentimento: { type: string, nullable: true }
        proximaPergunta:
          nullable: true
          description: Nula quando todas as perguntas foram respondidas.
          allOf:
            - $ref: '#/components/schemas/CampoPublico'
        concluida: { type: boolean }

    # ── Origem (Pablo) ─────────────────────────────────────────────────
    ToqueOrigem:
      type: object
      properties:
        utmSource: { type: string, nullable: true, example: "instagram" }
        utmMedium: { type: string, nullable: true, example: "cpc" }
        utmCampaign: { type: string, nullable: true, example: "black-friday-2026" }
        utmTerm: { type: string, nullable: true }
        utmContent: { type: string, nullable: true }
        referenciador: { type: string, nullable: true, description: document.referrer, example: 'https://www.google.com/' }
        paginaEntrada: { type: string, nullable: true, description: URL em que o visitante entrou. }
        ocorridoEm: { type: string, format: date-time }
    Origem:
      type: object
      description: Primeira e última origem do visitante, guardadas pelo `form.js` no navegador.
      properties:
        primeira: { $ref: '#/components/schemas/ToqueOrigem' }
        ultima: { $ref: '#/components/schemas/ToqueOrigem' }

    # ── Métricas (Pablo) ───────────────────────────────────────────────
    Metricas:
      type: object
      properties:
        visitas: { type: integer, example: 1240 }
        iniciosPreenchimento: { type: integer, example: 310 }
        conclusoes: { type: integer, example: 155 }
        abandonos: { type: integer, example: 155 }
        taxaConversao:
          type: number
          description: Conclusões ÷ visitas, em pontos percentuais com até 4 casas (§8.7). `12.5` = 12,5%.
          example: 12.5

    # ── Landing pages (Giovanna) ───────────────────────────────────────
    StatusPagina:
      type: string
      enum: [RASCUNHO, PUBLICADA, ARQUIVADA]
    LandingPageEntrada:
      type: object
      required: [nome, slug]
      properties:
        nome: { type: string, maxLength: 120, example: "Black Friday 2026" }
        slug:
          type: string
          pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
          maxLength: 80
          description: Único em toda a instalação, porque identifica o tenant na superfície pública.
          example: black-friday-2026
        seo:
          type: object
          properties:
            titulo: { type: string, maxLength: 70 }
            descricao: { type: string, maxLength: 160 }
            imagemCompartilhamento: { type: string, format: uri, nullable: true }
            indexar: { type: boolean, default: true }
        rastreamento:
          type: object
          description: Identificadores de rastreamento da página. Chaves a definir pela frente.
          additionalProperties: { type: string }
        tema:
          type: object
          properties:
            corPrimaria: { type: string, example: '#2563EB' }
            corFundo: { type: string, example: '#FFFFFF' }
            fonte: { type: string, example: "Inter" }
    LandingPageResumo:
      type: object
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        slug: { type: string }
        status: { $ref: '#/components/schemas/StatusPagina' }
        totalVisitas: { type: integer, readOnly: true }
        totalEnvios: { type: integer, readOnly: true }
        publicadaEm: { type: string, format: date-time, nullable: true }
    LandingPage:
      allOf:
        - type: object
          properties:
            id: { type: string, format: uuid, readOnly: true }
            status: { $ref: '#/components/schemas/StatusPagina' }
            publicadaEm: { type: string, format: date-time, nullable: true, readOnly: true }
            temAlteracaoNaoPublicada:
              type: boolean
              readOnly: true
              description: O rascunho mudou depois da última publicação.
            blocos:
              type: array
              readOnly: true
              items: { $ref: '#/components/schemas/Bloco' }
        - $ref: '#/components/schemas/LandingPageEntrada'
        - $ref: '#/components/schemas/Auditoria'
    TipoBloco:
      type: string
      enum: [TITULO, TEXTO, IMAGEM, BENEFICIOS, DEPOIMENTOS, FORMULARIO, CHAMADA_ACAO, PERGUNTAS_FREQUENTES, RODAPE]
    BlocoEntrada:
      type: object
      required: [tipo, conteudo]
      properties:
        tipo: { $ref: '#/components/schemas/TipoBloco' }
        conteudo:
          type: object
          description: Propriedades do bloco, livres por tipo (guardadas como JSON).
          additionalProperties: true
          example: { titulo: Até 40% de desconto, subtitulo: Só até domingo }
        formularioId:
          type: string
          format: uuid
          nullable: true
          description: Obrigatório quando `tipo` = FORMULARIO.
    Bloco:
      allOf:
        - type: object
          properties:
            id: { type: string, format: uuid, readOnly: true }
            ordem: { type: integer, readOnly: true }
        - $ref: '#/components/schemas/BlocoEntrada'
    PaginaPublicada:
      type: object
      properties:
        slug: { type: string }
        seo:
          type: object
          properties:
            titulo: { type: string }
            descricao: { type: string }
            imagemCompartilhamento: { type: string, nullable: true }
            indexar: { type: boolean }
        html:
          type: string
          description: HTML congelado gerado na publicação.
        formularios:
          type: array
          description: Chaves públicas dos formulários embutidos, para o `form.js`.
          items: { type: string }
        publicadaEm: { type: string, format: date-time }

    # ── Superfície pública (Emmylio / Pablo) ───────────────────────────
    CampoPublico:
      type: object
      description: Só o necessário para renderizar — sem `mapeamentoCrm` nem dados internos.
      properties:
        id: { type: string, format: uuid }
        rotulo: { type: string }
        tipo: { $ref: '#/components/schemas/TipoCampo' }
        obrigatorio: { type: boolean }
        placeholder: { type: string, nullable: true }
        opcoes: { type: array, nullable: true, items: { type: string } }
        ordem: { type: integer }
        textoPergunta:
          type: string
          nullable: true
          description: Só no modo CHATBOT.
    FormularioPublico:
      type: object
      properties:
        chavePublica: { type: string }
        nome: { type: string }
        modoExibicao: { $ref: '#/components/schemas/ModoExibicao' }
        textoConsentimento: { type: string }
        campos:
          type: array
          items: { $ref: '#/components/schemas/CampoPublico' }
    EnvioPublico:
      type: object
      required: [respostas, consentimento]
      properties:
        respostas:
          type: object
          description: Mapa `campoId → valor`.
          additionalProperties: {}
          example:
            8d1e5a2c-0000-4000-8000-000000000001: Ana Souza
            8d1e5a2c-0000-4000-8000-000000000002: ana@empresa.com.br
        consentimento:
          type: object
          required: [aceito]
          properties:
            aceito: { type: boolean, enum: [true] }
        paginaSlug:
          type: string
          nullable: true
          description: Slug da landing page, quando o formulário está dentro de uma.
        origem: { $ref: '#/components/schemas/Origem' }
    ConfirmacaoEnvio:
      type: object
      properties:
        mensagemSucesso: { type: string }
        urlRedirecionamento: { type: string, format: uri, nullable: true }
