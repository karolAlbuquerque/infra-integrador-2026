openapi: 3.0.3
info:
  title: Landing Pages e Formulários — API
  version: 0.1.0
  description: |
    Contrato da API do módulo `landing` (Grupo 7 — Rafael), conforme o Contrato de
    Integração dos Módulos v0.7.

    **Escopo deste arquivo:** frentes de Camila Martins Sousa (formulários e fundação),
    Giovanna Castro Freitas (landing pages), Emmylio Chaves Queiroz (área pública e embed)
    e Pablo Leandro Gloria (chatbot, origem e métricas). As rotas de envios (telas 7 e 8,
    frente do Rafael) ficam fora e entram no mesmo arquivo pelo PR dele.

    **Regras do Contrato aplicadas em todas as rotas**
    - Envelope `success` / `data` / `message` / `errors` em todas as respostas, inclusive
      as de erro (§8.2). A única exceção é o arquivo estático `form.js`.
    - O tenant vem **sempre** do claim `tenant_id` do token (superfície autenticada) ou da
      chave pública do formulário / slug da página (superfície pública). Nenhuma rota
      aceita `tenantId` no corpo, na query ou em cabeçalho (§6, §12.6).
    - Registro de outro tenant responde `404`, nunca `403` (§8.4).
    - Listagens paginadas, no máximo 100 itens por página (§8.3).
    - Rotas públicas ficam sob `/public/landing/**`, sem token, com rate limit por IP, e
      nunca devolvem dado de negócio (§12.6).

    **Extensões usadas:** `x-responsavel` indica a frente dona da rota; `x-situacao` diz se
    a rota já foi entregue (`implementado`) ou ainda está prevista (`previsto`).
  contact:
    name: Grupo 7 — Landing Pages e Formulários
servers:
  - url: http://localhost:8080
    description: Gateway, em desenvolvimento (tráfego do navegador)
  - url: http://landing:8088
    description: Chamada direta entre serviços, na rede do Docker (§9.1)

security:
  - bearerAuth: []

tags:
  - name: Sistema
    description: Saúde do serviço (§8.5). Frente de Camila Martins Sousa (fundação).
  - name: Formulários
    description: Telas 4 e 5. Frente de Camila Martins Sousa.
  - name: Landing Pages
    description: Telas 1, 2 e 3. Frente de Giovanna Castro Freitas.
  - name: Embed
    description: Tela 10. Frente de Emmylio Chaves Queiroz.
  - name: Chatbot
    description: Tela 6. Frente de Pablo Leandro Gloria.
  - name: Métricas
    description: Tela 11. Frente de Pablo Leandro Gloria.
  - name: Público — Formulário
    description: Telas 13 e 14 e `form.js`. Frente de Emmylio Chaves Queiroz.
  - name: Público — Landing Page
    description: Tela 12. Frente de Giovanna Castro Freitas.
  - name: Público — Chatbot e origem
    description: Tela 15, registro de visitas e de início de preenchimento. Frente de Pablo Leandro Gloria.

paths:

  # ════════════════════════════════════════════════════════════════════
  #  SISTEMA — Camila (fundação)
  # ════════════════════════════════════════════════════════════════════

  /api/landing/health:
    get:
      tags: [Sistema]
      summary: Saúde do serviço
      description: Responde `200` quando o serviço está de pé e conectado ao banco. Não exige token (§8.5).
      operationId: health
      x-responsavel: Camila Martins Sousa
      x-situacao: previsto
      security: []
      responses:
        '200':
          description: Serviço de pé
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status: { type: string, example: "UP" }

  # ════════════════════════════════════════════════════════════════════
  #  FORMULÁRIOS — Camila (telas 4 e 5)
  # ════════════════════════════════════════════════════════════════════

  /api/landing/formularios:
    get:
      tags: [Formulários]
      summary: Listar formulários (tela 4)
      operationId: listarFormularios
      x-responsavel: Camila Martins Sousa
      x-situacao: previsto
      x-permissao: landing.formulario.ver
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamanho'
        - $ref: '#/components/parameters/Ordenar'
        - name: nome
          in: query
          description: Filtra pelo nome (contém, sem diferenciar maiúsculas).
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/StatusFormulario' }
      responses:
        '200':
          description: Página de formulários
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PaginaResultado'
                          - type: object
                            properties:
                              itens:
                                type: array
                                items: { $ref: '#/components/schemas/FormularioResumo' }
        '400': { $ref: '#/components/responses/ErroValidacao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    post:
      tags: [Formulários]
      summary: Criar formulário
      operationId: criarFormulario
      x-responsavel: Camila Martins Sousa
      x-situacao: previsto
      x-permissao: landing.formulario.criar
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormularioEntrada' }
      responses:
        '201': { $ref: '#/components/responses/FormularioCriado' }
        '400': { $ref: '#/components/responses/ErroValidacao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }

  /api/landing/formularios/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Formulários]
      summary: Detalhar formulário, com os campos (tela 5)
      operationId: detalharFormulario
      x-responsavel: Camila Martins Sousa
      x-situacao: previsto
      x-permissao: landing.formulario.ver
      responses:
        '200':
          description: Formulário
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Formulario' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    put:
      tags: [Formulários]
      summary: Editar formulário
      operationId: editarFormulario
      x-responsavel: Camila Martins Sousa
      x-situacao: previsto
      x-permissao: landing.formulario.editar
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FormularioEntrada' }
      responses:
        '200':
          description: Formulário atualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Formulario' }
        '400': { $ref: '#/components/responses/ErroValidacao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    delete:
      tags: [Formulários]
      summary: Excluir formulário (exclusão lógica)
      description: Preenche `deleted_at`. O formulário deixa de aceitar envios e some das listagens.
      operationId: excluirFormulario
      x-responsavel: Camila Martins Sousa
      x-situacao: previsto
      x-permissao: landing.formulario.excluir
      responses:
        '200': { $ref: '#/components/responses/SucessoSemDados' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /api/landing/formularios/{id}/duplicar:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [Formulários]
      summary: Duplicar formulário
      description: Cria um formulário novo, em `INATIVO`, com cópia dos campos e uma chave pública nova.
      operationId: duplicarFormulario
      x-responsavel: Camila Martins Sousa
      x-situacao: previsto
      x-permissao: landing.formulario.criar
      responses:
        '201': { $ref: '#/components/responses/FormularioCriado' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /api/landing/formularios/{id}/status:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Formulários]
      summary: Ativar ou desativar o formulário
      description: Só formulário `ATIVO` é servido pelas rotas públicas.
      operationId: alterarStatusFormulario
      x-responsavel: Camila Martins Sousa
      x-situacao: previsto
      x-permissao: landing.formulario.editar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/StatusFormulario' }
      responses:
        '200':
          description: Status alterado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Formulario' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
        '422':
          description: Formulário sem nenhum campo não pode ser ativado (`FORMULARIO_SEM_CAMPOS`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeErro' }

  /api/landing/formularios/{id}/campos:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Formulários]
      summary: Listar campos do formulário, na ordem
      description: Lista limitada pela natureza do recurso (campos de um formulário); não paginada.
      operationId: listarCampos
      x-responsavel: Camila Martins Sousa
      x-situacao: previsto
      x-permissao: landing.formulario.ver
      responses:
        '200':
          description: Campos
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Campo' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    post:
      tags: [Formulários]
      summary: Adicionar campo
      description: O campo entra no fim da lista.
      operationId: criarCampo
      x-responsavel: Camila Martins Sousa
      x-situacao: previsto
      x-permissao: landing.formulario.editar
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampoEntrada' }
      responses:
        '201': { $ref: '#/components/responses/CampoCriado' }
        '400': { $ref: '#/components/responses/ErroValidacao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /api/landing/formularios/{id}/campos/ordem:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Formulários]
      summary: Reordenar campos
      description: Recebe todos os ids de campo do formulário na nova ordem.
      operationId: reordenarCampos
      x-responsavel: Camila Martins Sousa
      x-situacao: previsto
      x-permissao: landing.formulario.editar
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Reordenacao' }
      responses:
        '200': { $ref: '#/components/responses/SucessoSemDados' }
        '400':
          description: Lista incompleta ou com id de outro formulário (`ORDEM_INVALIDA`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeErro' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /api/landing/formularios/{id}/campos/{campoId}:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/CampoId'
    put:
      tags: [Formulários]
      summary: Editar campo
      operationId: editarCampo
      x-responsavel: Camila Martins Sousa
      x-situacao: previsto
      x-permissao: landing.formulario.editar
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CampoEntrada' }
      responses:
        '200':
          description: Campo atualizado
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Campo' }
        '400': { $ref: '#/components/responses/ErroValidacao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    delete:
      tags: [Formulários]
      summary: Excluir campo (exclusão lógica)
      description: Respostas já recebidas para o campo continuam guardadas nos envios.
      operationId: excluirCampo
      x-responsavel: Camila Martins Sousa
      x-situacao: previsto
      x-permissao: landing.formulario.editar
      responses:
        '200': { $ref: '#/components/responses/SucessoSemDados' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /api/landing/formularios/{id}/campos/{campoId}/duplicar:
    parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/CampoId'
    post:
      tags: [Formulários]
      summary: Duplicar campo
      description: A cópia entra logo abaixo do campo original.
      operationId: duplicarCampo
      x-responsavel: Camila Martins Sousa
      x-situacao: previsto
      x-permissao: landing.formulario.editar
      responses:
        '201': { $ref: '#/components/responses/CampoCriado' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  # ════════════════════════════════════════════════════════════════════
  #  EMBED — Emmylio (tela 10)
  # ════════════════════════════════════════════════════════════════════

  /api/landing/formularios/{id}/embed:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Embed]
      summary: Código de incorporação, link hospedado e domínios autorizados
      operationId: obterEmbed
      x-responsavel: Emmylio Chaves Queiroz
      x-situacao: previsto
      x-permissao: landing.formulario.ver
      responses:
        '200':
          description: Configuração de embed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ConfiguracaoEmbed' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  /api/landing/formularios/{id}/embed/dominios:
    parameters:
      - $ref: '#/components/parameters/Id'
    put:
      tags: [Embed]
      summary: Substituir a lista de domínios autorizados (RF27)
      description: |
        Domínios que podem usar o formulário via embed. A validação desses domínios nas
        rotas públicas já foi entregue no MR; a tela que mantém a lista ainda está prevista.
      operationId: atualizarDominiosEmbed
      x-responsavel: Emmylio Chaves Queiroz
      x-situacao: previsto
      x-permissao: landing.formulario.compartilhar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [dominios]
              properties:
                dominios:
                  type: array
                  maxItems: 50
                  items:
                    type: string
                    description: Domínio sem esquema nem caminho.
                    example: www.empresacliente.com.br
      responses:
        '200':
          description: Lista atualizada
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ConfiguracaoEmbed' }
        '400':
          description: Domínio mal formado (`DOMINIO_INVALIDO`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeErro' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  # ════════════════════════════════════════════════════════════════════
  #  CHATBOT — Pablo (tela 6)
  # ════════════════════════════════════════════════════════════════════

  /api/landing/formularios/{id}/chatbot:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Chatbot]
      summary: Configuração das perguntas do chatbot
      description: |
        O chatbot é um modo de exibição do formulário, não um recurso separado. Cada campo
        recebe um texto de pergunta e uma posição na conversa.
      operationId: obterChatbot
      x-responsavel: Pablo Leandro Gloria
      x-situacao: previsto
      x-permissao: landing.chatbot.ver
      responses:
        '200':
          description: Perguntas na ordem da conversa
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ConfiguracaoChatbot' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    put:
      tags: [Chatbot]
      summary: Salvar ordem e texto das perguntas
      description: Substitui a configuração inteira. Todo campo do formulário precisa aparecer uma vez.
      operationId: salvarChatbot
      x-responsavel: Pablo Leandro Gloria
      x-situacao: previsto
      x-permissao: landing.chatbot.editar
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfiguracaoChatbot' }
      responses:
        '200':
          description: Configuração salva
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ConfiguracaoChatbot' }
        '400':
          description: Campo faltando, repetido ou de outro formulário (`PERGUNTAS_INVALIDAS`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeErro' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }

  # ════════════════════════════════════════════════════════════════════
  #  LANDING PAGES — Giovanna (telas 1, 2 e 3)
  # ════════════════════════════════════════════════════════════════════

  /api/landing/paginas:
    get:
      tags: [Landing Pages]
      summary: Listar landing pages (tela 1)
      operationId: listarPaginas
      x-responsavel: Giovanna Castro Freitas
      x-situacao: previsto
      x-permissao: landing.pagina.ver
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/Tamanho'
        - $ref: '#/components/parameters/Ordenar'
        - name: nome
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/StatusPagina' }
      responses:
        '200':
          description: Página de landing pages
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data:
                        allOf:
                          - $ref: '#/components/schemas/PaginaResultado'
                          - type: object
                            properties:
                              itens:
                                type: array
                                items: { $ref: '#/components/schemas/LandingPageResumo' }
        '400': { $ref: '#/components/responses/ErroValidacao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
    post:
      tags: [Landing Pages]
      summary: Criar landing page (nasce em RASCUNHO)
      operationId: criarPagina
      x-responsavel: Giovanna Castro Freitas
      x-situacao: previsto
      x-permissao: landing.pagina.criar
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LandingPageEntrada' }
      responses:
        '201': { $ref: '#/components/responses/PaginaCriada' }
        '400': { $ref: '#/components/responses/ErroValidacao' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '409': { $ref: '#/components/responses/SlugDuplicado' }

  /api/landing/paginas/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      tags: [Landing Pages]
      summary: Detalhar landing page, com os blocos do rascunho
      operationId: detalharPagina
      x-responsavel: Giovanna Castro Freitas
      x-situacao: previsto
      x-permissao: landing.pagina.ver
      responses:
        '200':
          description: Landing page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LandingPage' }
        '401': { $ref: '#/components/responses/NaoAutenticado' }
        '403': { $ref: '#/components/responses/SemPermissao' }
        '404': { $ref: '#/components/responses/NaoEncontrado' }
    put:
      tags: [Landing Pages]
      summary: Editar configurações da página (tela 3)
