  # ════════════════════════════════════════════════════════════════════
  #  PÚBLICO — FORMULÁRIO E EMBED — Emmylio (MR entregue)
  # ════════════════════════════════════════════════════════════════════

  /public/landing/formularios/{chavePublica}:
    parameters:
      - $ref: '#/components/parameters/ChavePublica'
    get:
      tags: [Público — Formulário]
      summary: Schema público do formulário
      description: |
        Devolve só o necessário para renderizar o formulário: campos, rótulos, tipos,
        obrigatoriedade, modo de exibição e texto de consentimento. Nenhum dado
        administrativo, nenhum envio, nenhum dado de outro módulo (§12.6).

        Usado pelo `form.js` (embed, telas 14 e 15) e pela página hospedada (tela 13).
        O tenant é resolvido pela chave pública, no servidor.

        **Domínios autorizados (RF27):** quando a requisição chega de outro site (cabeçalho
        `Origin` diferente da plataforma), o domínio precisa estar na lista do formulário.

        **Implementação atual:** entregue no MR como `GET /public/v1/forms/{formKey}`.
        A rota precisa ser renomeada para este caminho — o gateway só encaminha
        `/public/landing/**` ao container `landing` (§12.8) e o caminho não leva versão
        nem nome em inglês (§8.1).
      operationId: obterFormularioPublico
      x-responsavel: Emmylio Chaves Queiroz
      x-situacao: implementado
      x-rota-no-mr: GET /public/v1/forms/{formKey}
      security: []
      responses:
        '200':
          description: Schema público
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/FormularioPublico' }
        '403': { $ref: '#/components/responses/DominioNaoAutorizado' }
        '404':
          description: Chave inexistente, formulário excluído ou inativo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeErro' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }

  /public/landing/formularios/{chavePublica}/envios:
    parameters:
      - $ref: '#/components/parameters/ChavePublica'
    post:
      tags: [Público — Formulário]
      summary: Receber e gravar a resposta de um visitante
      description: |
        Ordem das verificações: domínio autorizado → honeypot → consentimento → validação
        dos campos → gravação. Depois do *commit*, a frente de envios (Rafael) traduz pelo
        `crm_mapping`, cria/reaproveita empresa e contato no CRM por token de serviço e
        publica `landing.formulario.recebido`.

        **Honeypot:** se o campo-armadilha renderizado pelo `form.js` vier preenchido, a
        resposta é **idêntica** à de sucesso e nada é gravado (bloqueio silencioso), para o
        robô não perceber.

        **Consentimento LGPD:** sem `consentimento.aceito = true` a requisição volta `400`
        com `CONSENTIMENTO_OBRIGATORIO`.

        A resposta não devolve o id do envio nem dado algum: a superfície pública recebe,
        não consulta (§12.6).

        **Implementação atual:** entregue no MR como `POST /public/v1/forms/{formKey}/submissions`.
      operationId: enviarFormularioPublico
      x-responsavel: Emmylio Chaves Queiroz
      x-situacao: implementado
      x-rota-no-mr: POST /public/v1/forms/{formKey}/submissions
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EnvioPublico' }
      responses:
        '200':
          description: Envio recebido (também a resposta do honeypot)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Envelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ConfirmacaoEnvio' }
        '400':
          description: |
            Campo inválido ou obrigatório ausente (`CAMPO_OBRIGATORIO`, `CNPJ_INVALIDO`,
            `CPF_INVALIDO`, `EMAIL_INVALIDO`, `TELEFONE_INVALIDO`) ou consentimento ausente
            (`CONSENTIMENTO_OBRIGATORIO`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeErro' }
              example:
                success: false
                data: null
                message: Não foi possível enviar o formulário.
                errors:
                  - campo: consentimento
                    codigo: CONSENTIMENTO_OBRIGATORIO
                    detalhe: É preciso aceitar o termo de consentimento para enviar.
        '403': { $ref: '#/components/responses/DominioNaoAutorizado' }
        '404':
          description: Chave inexistente, formulário excluído ou inativo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnvelopeErro' }
        '429': { $ref: '#/components/responses/LimiteExcedido' }

  /public/landing/form.js:
    get:
      tags: [Público — Formulário]
      summary: Script de incorporação
      description: |
        Arquivo estático que renderiza o formulário (modo tradicional, passo a passo ou
        chatbot) dentro do site da empresa cliente. Responde o próprio arquivo, fora do
        envelope, como na exceção de download da §8.2.

        Uso no site externo:
        `<script src="https://{dominio}/public/landing/form.js" data-formulario="{chavePublica}" async></script>`
      operationId: obterScriptEmbed
      x-responsavel: Emmylio Chaves Queiroz
      x-situacao: implementado
      security: []
      responses:
        '200':
          description: O script
          content:
            text/javascript:
              schema: { type: string }

